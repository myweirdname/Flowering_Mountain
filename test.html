<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>De Bloeiende Berg: testbots</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f3fbff; color: #234; margin: 24px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    p { margin: 4px 0 16px; color: #567; }
    table { border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 10px #0001; }
    th, td { padding: 8px 14px; text-align: left; border-bottom: 1px solid #e6eef3; font-variant-numeric: tabular-nums; }
    th { background: #dff3ea; }
    .ok { color: #1c8a4a; font-weight: 600; }
    .fout { color: #c0392b; font-weight: 600; }
    .balk { height: 8px; background: #e6eef3; border-radius: 4px; width: 140px; overflow: hidden; }
    .balk > div { height: 100%; background: #4fd6a0; }
    #klaar { margin-top: 14px; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Testbots van het speelbos</h1>
  <p>Elke doorgang wordt op veel zaadjes (verschillende afstanden en aantallen) gebouwd en door zijn testbot uitgespeeld,
     met dezelfde spelregels als de speler. <code>?n=200</code> kiest het aantal zaadjes.</p>
  <table>
    <thead><tr><th>doorgang</th><th>gehaald</th><th></th><th>gem. tijd</th><th>langste</th><th>eerlijk</th><th>mislukt bij zaadje</th></tr></thead>
    <tbody id="rijen"></tbody>
  </table>
  <div id="klaar">Bezig ...</div>
  <script type="module">
    import { SPEELBOS } from './src/data/speelbos.js';
    import { LOPEN } from './src/data/beweging.js';
    import { maakSpeelbos } from './src/sim/doorgangen/speelbos.js';
    import { speelDoorgang } from './src/sim/doorgangen/bots.js';

    const N = +(new URLSearchParams(location.search).get('n') ?? 200);
    const rijen = document.getElementById('rijen');
    const soorten = SPEELBOS.modules.map(([s]) => s);
    // Zo ver en zo hoog kom je met een gewone sprong (aanloop op rensnelheid): een doorgang moet verder zijn,
    // anders spring je er gewoon over en heb je hem niet nodig.
    const L = LOPEN;
    const hoog = (L.springSnelheid ** 2) / (2 * L.zwaartekracht);
    const ver = (zakken) => L.rensnelheid * (L.springSnelheid / L.zwaartekracht + Math.sqrt((2 * (hoog + zakken)) / L.valZwaartekracht));
    const uitslag = Object.fromEntries(soorten.map((s) => [s, { ok: 0, n: 0, tijd: 0, max: 0, fout: [], eerlijk: true }]));
    const regel = (s) => {
      const r = uitslag[s];
      const pct = Math.round((r.ok / Math.max(1, r.n)) * 100);
      return `<td>${s}</td><td class="${r.ok === r.n ? 'ok' : 'fout'}">${r.ok} / ${r.n}</td>` +
        `<td><div class="balk"><div style="width:${pct}%"></div></div></td>` +
        `<td>${(r.tijd / Math.max(1, r.ok)).toFixed(1)} s</td><td>${r.max.toFixed(1)} s</td>` +
        `<td class="${r.eerlijk ? 'ok' : 'fout'}">${r.eerlijk ? 'ja' : 'nee'}</td><td>${r.fout.slice(0, 6).join(', ')}</td>`;
    };
    const tr = Object.fromEntries(soorten.map((s) => {
      const t = document.createElement('tr');
      rijen.appendChild(t);
      return [s, t];
    }));
    let z = 1;
    const t0 = performance.now();
    function stap() {
      const eind = performance.now() + 250; // per beurt een stukje rekenen, tussendoor het scherm bijwerken
      while (z <= N && performance.now() < eind) {
        for (const kant of [1, -1]) {
          for (let i = 0; i < soorten.length; i++) {
            const bos = maakSpeelbos(SPEELBOS, { x: 0, z: 0 }, kant, () => 7, z * 7919);
            const m = bos.modules[i];
            // Eerlijk: zonder de doorgang kom je er niet (te ver om te springen, of te hoog).
            const hoger = m.h1 - m.h0;
            const eerlijk = m.soort === 'springbloem' ? hoger > hoog + L.klimHoogte : m.len > ver(Math.max(0, -hoger));
            const r = speelDoorgang(bos, i);
            const u = uitslag[m.soort];
            u.n++;
            if (!eerlijk) u.eerlijk = false;
            if (r.gehaald) {
              u.ok++;
              u.tijd += r.tijd;
              u.max = Math.max(u.max, r.tijd);
            } else u.fout.push(`${z}${kant < 0 ? '′' : ''} (${r.reden})`);
          }
        }
        z++;
      }
      for (const s of soorten) tr[s].innerHTML = regel(s);
      if (z <= N) setTimeout(stap, 0);
      else {
        const alles = soorten.every((s) => uitslag[s].ok === uitslag[s].n && uitslag[s].eerlijk);
        document.getElementById('klaar').innerHTML = `${alles ? '<span class="ok">Alles gehaald.</span>' : '<span class="fout">Niet alles gehaald.</span>'} ` +
          `${N} zaadjes × 2 kanten in ${((performance.now() - t0) / 1000).toFixed(1)} s.`;
        window.uitslag = uitslag;
        window.klaar = true;
      }
    }
    stap();
  </script>
</body>
</html>
